name: BOATERS notification manual test

# Production monitoring runs locally from approved visible screenshots.
# Keeping a second scheduled cloud monitor would duplicate notifications and
# cannot access the local screenshot evidence, so this workflow is manual only.
on:
  workflow_dispatch:

concurrency:
  group: boaters-ntfy-manual-test
  cancel-in-progress: false

jobs:
  test-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send one notification test
        env:
          BOATERS_NTFY_SERVER: ${{ secrets.BOATERS_NTFY_SERVER }}
          BOATERS_NTFY_TOPIC: ${{ secrets.BOATERS_NTFY_TOPIC || 'boat10000-codex-manshu-7d56f47f-ee5f-48f8-905a-ed6e5025b8db' }}
          BOATERS_NTFY_TOKEN: ${{ secrets.BOATERS_NTFY_TOKEN }}
        run: python scripts/monitor_boaters_manshu_alerts.py --test-push
